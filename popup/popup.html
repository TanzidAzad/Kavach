<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kavach</title>
  <link rel="icon" href="../sidepanel/brand/icon32.png">
  <!-- Same look as the side panel; popup.css only sets the popup's size. -->
  <link rel="stylesheet" href="../sidepanel/sidepanel.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="logo" src="../sidepanel/brand/logo-header.png" alt="Kavach">
    <select id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="hi">हिन्दी</option>
      <option value="zh">中文</option>
    </select>
  </header>

  <main>
    <!-- The popup only starts a check. The answer shows in the side panel. -->
    <button id="check-page" class="primary big" type="button" data-i18n="checkThisPage">Check this page</button>

    <textarea id="message" rows="3" data-i18n-placeholder="pasteMessage" placeholder="Paste a message…"></textarea>
    <div class="upload-row">
      <label class="upload" id="upload-label">📎 <span data-i18n="uploadScreenshot">Upload screenshot</span>
        <input id="screenshot" type="file" accept="image/*" hidden>
      </label>
      <span id="file-info" class="file-info" hidden>
        📎 <span data-i18n="screenshotAdded">Screenshot added</span>
        <button id="remove-file" class="link" type="button" aria-label="Remove screenshot">✕</button>
      </span>
    </div>
    <p id="image-note" class="note" data-i18n="screenshotNote" hidden></p>
    <button id="check-message" type="button" data-i18n="checkMessage" hidden>Check this message</button>

    <p id="status" class="status" role="status"></p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
