<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kavach Deep Check dev</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 760px; margin: 16px auto; padding: 0 16px; }
    textarea { width: 100%; height: 110px; }
    #steps div, #log { font-family: ui-monospace, monospace; font-size: 13px; }
    pre { white-space: pre-wrap; background: #f4f4f4; padding: 8px; }
  </style>
</head>
<body>
  <h3>Deep Check dev page</h3>
  <p>Server must be running: <code>cd server &amp;&amp; npm start</code></p>
  <select id="sample"></select>
  <textarea id="text"></textarea>
  <p><button id="deep">Run Deep Check</button> <button id="quick">Run Quick Check</button> <span id="status"></span></p>
  <div id="steps"></div>
  <pre id="out"></pre>
  <script type="module" src="dev.js"></script>
</body>
</html>
