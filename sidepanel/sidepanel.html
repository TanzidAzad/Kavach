<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kavach</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <span class="brand">🛡 <span data-i18n="appName">Kavach</span></span>
    <select id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="hi">हिन्दी</option>
      <option value="zh">中文</option>
    </select>
  </header>

  <main>
    <!-- Start: shown when the panel is opened with nothing to check -->
    <section id="start-view" hidden>
      <p id="problem" class="problem" role="alert" hidden></p>
      <textarea id="message" rows="7" data-i18n-placeholder="pasteMessage" placeholder="Paste a message…"></textarea>
      <div class="upload-row">
        <label class="upload" id="upload-label">📎 <span data-i18n="uploadScreenshot">Upload screenshot</span>
          <input id="screenshot" type="file" accept="image/*" hidden>
        </label>
        <span id="file-info" class="file-info" hidden>
          📎 <span data-i18n="screenshotAdded">Screenshot added</span>
          <button id="remove-file" class="link" type="button" aria-label="Remove screenshot">✕</button>
        </span>
      </div>
      <p id="image-note" class="note" data-i18n="screenshotNote" hidden></p>
      <button id="check" class="primary" type="button" data-i18n="check">Check</button>
    </section>

    <!-- Result: checklist while checking; meter, reasons and steps once the answer is in -->
    <section id="result-view" hidden>
      <div id="meter-block" hidden>
        <p class="heading" data-i18n="isItScam">Is this a scam?</p>
        <p id="level" class="level"><span class="dot" aria-hidden="true">●</span> <span id="level-label"></span></p>
        <div id="meter" class="meter" role="img">
          <span data-step="unlikely"></span><span data-step="unsure"></span><span data-step="likely"></span><span data-step="highly_likely"></span>
        </div>
      </div>

      <div id="reasons-block" hidden>
        <h2 class="heading" data-i18n="why">Why</h2>
        <ul id="reasons"></ul>
      </div>

      <div id="steps-block" hidden>
        <h2 class="heading" data-i18n="whatToDo">What to do</h2>
        <ol id="steps"></ol>
        <p id="contact" class="contact" hidden></p>
      </div>

      <div id="help-block" hidden>
        <button id="talk" class="primary talk" type="button">🎙️ <span id="talk-label" data-i18n="talkToKavach">Talk to Kavach in your language</span></button>
        <p class="small">
          <span data-i18n="speaksYourLanguage">Speaks your language</span>
          <button id="lang-info" class="info" type="button" aria-expanded="false" aria-controls="voice-langs">(i)</button>
        </p>
        <p id="voice-langs" class="small" hidden></p>

        <p class="links">
          <button id="family" class="link" type="button" data-i18n="tellFamily">Tell family</button>
          <span class="sep" aria-hidden="true">·</span>
          <button id="ftc" class="link" type="button" data-i18n="reportToFtc">Report to FTC</button>
        </p>

        <form id="family-form" class="family-form" hidden>
          <p data-i18n="familyAsk">Who should we send it to?</p>
          <label><span data-i18n="familyName">Their name</span><input id="family-name" autocomplete="off"></label>
          <label><span data-i18n="familyReach">Their phone or email</span><input id="family-reach" autocomplete="off"></label>
          <div class="form-buttons">
            <button class="primary" type="submit" data-i18n="save">Save</button>
            <button id="family-cancel" class="link" type="button" data-i18n="cancel">Cancel</button>
          </div>
        </form>
        <p id="family-change-row" class="small" hidden>
          <span id="family-who"></span> · <button id="family-change" class="link tiny" type="button" data-i18n="changeContact">Change contact</button>
        </p>
      </div>

      <div id="checklist-block">
        <h2 id="checklist-heading" class="heading"></h2>
        <ul id="checklist"></ul>
      </div>

      <button id="again" class="link again" type="button" data-i18n="checkAnother" hidden>Check another message</button>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
