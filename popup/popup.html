<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kavach</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="brand">🛡 <span data-i18n="appName">Kavach</span></span>
    <select id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="hi">हिन्दी</option>
      <option value="zh">中文</option>
    </select>
  </header>

  <main>
    <!-- Screen 1: paste a message -->
    <section id="input-view">
      <textarea id="message" rows="6" data-i18n-placeholder="pasteMessage" placeholder="Paste a message…"></textarea>

      <div class="upload-row">
        <label class="upload" id="upload-label">📎 <span data-i18n="uploadScreenshot">Upload screenshot</span>
          <input id="screenshot" type="file" accept="image/*" hidden>
        </label>
        <span id="file-info" class="file-info" hidden>
          📎 <span data-i18n="screenshotAdded">Screenshot added</span>
          <button id="remove-file" class="link" type="button" aria-label="Remove screenshot">✕</button>
        </span>
      </div>
      <p id="image-note" class="note" data-i18n="screenshotNote" hidden>Screenshots are sent as an image so the text can be read.</p>

      <button id="check" class="primary" data-i18n="check">Check</button>
    </section>

    <!-- Screen 2: the result (and the Deep Check checklist) -->
    <section id="result-view" hidden>
      <div id="verdict-line" class="verdict">
        <span><span aria-hidden="true">● </span><span id="verdict-label"></span></span>
        <span class="confidence"><span id="conf-label"></span>: <span id="conf-value"></span></span>
      </div>

      <div id="reasons-block">
        <p class="heading" data-i18n="why">Why:</p>
        <ul id="reasons"></ul>
      </div>

      <div id="checklist-block" hidden>
        <p class="heading" data-i18n="checking">Checking…</p>
        <ul id="checklist"></ul>
      </div>

      <div id="steps-block">
        <p class="heading" data-i18n="whatToDo">What to do:</p>
        <ol id="steps"></ol>
        <p id="contact" class="contact" hidden></p>
      </div>

      <div class="buttons">
        <button id="ask-family" data-i18n="askFamily">Ask family</button>
        <button id="deep-check" data-i18n="deepCheck">Deep check →</button>
      </div>
    </section>

    <footer class="footer">
      <button id="new-check" class="link" data-i18n="newCheck" hidden>← New check</button>
      <span id="status" class="status" role="status"></span>
    </footer>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
