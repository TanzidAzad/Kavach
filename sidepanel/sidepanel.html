<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kavach</title>
  <link rel="icon" href="brand/icon32.png">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body class="panel">
  <header>
    <img class="logo" src="brand/logo-header.png" alt="Kavach">
    <div class="header-right">
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="hi">हिन्दी</option>
        <option value="zh">中文</option>
      </select>
      <!-- Only in the floating panel -->
      <button id="close" class="icon-btn" type="button" aria-label="Close" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
  </header>

  <!-- The page never scrolls: everything fits the panel's height. -->
  <main>
    <!-- Start = launcher (same as clicking the Kavach icon): check this page, or paste / upload -->
    <section id="start-view" class="view" hidden>
      <p id="problem" class="problem" role="alert" hidden></p>
      <button id="check-page" class="primary big" type="button" data-i18n="checkThisPage">Check this page</button>
      <div class="paste-tile tile">
        <textarea id="message" data-i18n-placeholder="pasteMessage" placeholder="Paste a message…"></textarea>
        <div class="upload-row">
          <label class="upload" id="upload-label">📎 <span data-i18n="uploadScreenshot">Upload screenshot</span>
            <input id="screenshot" type="file" accept="image/*" hidden>
          </label>
          <span id="file-info" class="file-info" hidden>
            📎 <span data-i18n="screenshotAdded">Screenshot added</span>
            <button id="remove-file" class="link" type="button" aria-label="Remove screenshot">✕</button>
          </span>
        </div>
        <p id="image-note" class="note" data-i18n="screenshotNote" hidden></p>
        <!-- Appears only once there's something pasted or uploaded -->
        <button id="check" type="button" class="secondary" data-i18n="checkMessage" hidden>Check this message</button>
      </div>
    </section>

    <section id="result-view" class="view" hidden>
      <!-- While checking: small, quiet lines, like an assistant "thinking" -->
      <div id="thinking" class="thinking">
        <p class="thinking-row">
          <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <span id="thinking-label" class="thinking-label"></span>
        </p>
        <div id="thinking-slot"></div>
      </div>

      <div id="meter-block" class="tile" hidden>
        <p class="heading" data-i18n="isItScam">Is this a scam?</p>
        <p id="level" class="level"><span class="dot" aria-hidden="true">●</span> <span id="level-label"></span></p>
        <div id="meter" class="meter" role="img">
          <span data-step="unlikely"></span><span data-step="unsure"></span><span data-step="likely"></span><span data-step="highly_likely"></span>
        </div>
      </div>

      <!-- Main answer: what to do + actions -->
      <div id="answer" class="answer" hidden>
        <div class="todo-card tile">
          <h2 class="heading" data-i18n="whatToDo">What to do</h2>
          <ol id="steps"></ol>
          <p id="contact" class="contact" hidden></p>
        </div>

        <div id="help-block" hidden>
          <button id="talk" class="primary talk" type="button"><span class="talk-ico"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span id="talk-label" data-i18n="cardTalk">Talk to Kavach</span></button>
          <p class="small">
            <span data-i18n="speaksYourLanguage">Speaks your language</span>
            <button id="lang-info" class="info" type="button" aria-label="Languages" aria-expanded="false" aria-controls="voice-langs"><svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="6.2" r="1.15" fill="currentColor"/><path d="M10 9v5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
            <span id="voice-langs" hidden></span>
          </p>
          <div class="half-buttons">
            <button id="family" class="tile-btn" type="button"><span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6M16 5.2a3 3 0 0 1 0 5.6M17.5 14.6c1.7.6 2.7 2.1 3 4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span data-i18n="tellFamily">Tell family</span></button>
            <button id="ftc" class="tile-btn" type="button"><span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 21V4m0 0h11l-2 4 2 4H5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span data-i18n="reportToFtc">Report to FTC</span></button>
          </div>
          <p id="family-change-row" class="small" hidden>
            <span id="family-who"></span> · <button id="family-change" class="link tiny" type="button" data-i18n="changeContact">Change contact</button>
          </p>
        </div>
      </div>

      <!-- Show more: why + what Kavach checked (replaces the answer area while open) -->
      <div id="details" class="details" hidden>
        <div id="reasons-block">
          <h2 class="heading" data-i18n="why">Why</h2>
          <ul id="reasons"></ul>
        </div>
        <h2 class="heading" data-i18n="whatWeChecked">What Kavach checked</h2>
        <div id="details-slot"></div>
      </div>

      <!-- The checklist moves between "thinking" and "details" -->
      <ul id="checklist" class="checklist"></ul>

      <button id="more" class="link more" type="button" aria-expanded="false" hidden></button>
    </section>
  </main>

  <footer>
    <button id="again" class="link tiny" type="button" data-i18n="checkAnother" hidden>Check another message</button>
    <span id="status" class="status" role="status"></span>
  </footer>

  <!-- Tell family: first time, a small sheet slides over the bottom -->
  <form id="family-form" class="sheet" hidden>
    <p data-i18n="familyAsk">Who should we send it to?</p>
    <label><span data-i18n="familyName">Their name</span><input id="family-name" autocomplete="off"></label>
    <label><span data-i18n="familyReach">Their phone or email</span><input id="family-reach" autocomplete="off"></label>
    <div class="form-buttons">
      <button class="primary" type="submit" data-i18n="save">Save</button>
      <button id="family-cancel" class="link" type="button" data-i18n="cancel">Cancel</button>
    </div>
  </form>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
