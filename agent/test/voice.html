<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kavach voice test</title>
<style>
  :root { --text: #202124; --grey: #5f6368; --line: #dadce0; --scam: #D93025; --safe: #188038; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: #fff; }
  main { max-width: 560px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  select, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--text); }
  button.primary { background: var(--text); color: #fff; border-color: var(--text); font-weight: 600; }
  button:disabled { opacity: .5; }
  #state { font-weight: 600; }
  #meta, #mic, small { color: var(--grey); }
  #log { border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 160px; margin-top: 10px; }
  #log p { margin: 6px 0; } #log .user { color: var(--grey); } #log .kavach::before { content: "Kavach: "; font-weight: 600; } #log .user::before { content: "You: "; font-weight: 600; }
  #log .partial { opacity: .6; }
  .err { color: var(--scam); }
  pre { white-space: pre-wrap; font-size: 12px; color: var(--grey); max-height: 140px; overflow: auto; }
</style>
</head>
<body>
<main>
  <h1>🛡 Kavach voice test</h1>
  <div class="row">
    <label>Language <select id="lang"></select></label>
    <label><input type="checkbox" id="talk"> Talk mode (verdict arrives after 4 s)</label>
  </div>
  <div class="row">
    <button id="start" class="primary">Start</button>
    <button id="stop" disabled>Stop</button>
    <button id="fallback">Test fallback voice</button>
    <label><input type="checkbox" id="breakit"> Simulate server down</label>
  </div>
  <div>State: <span id="state">idle</span> <span id="meta"></span></div>
  <div id="mic"></div>
  <div id="log"></div>
  <details><summary><small>Demo verdict (agent/demo_run.json)</small></summary><pre id="verdict"></pre></details>
</main>
<script type="module" src="voice-test.js"></script>
</body>
</html>
